<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Планер участкового педиатра</title>
<meta name="description" content="Рабочий планер участкового педиатра: срочные дела, план по датам, направления, диспансерное наблюдение и дети-инвалиды.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232F51B5'/><path d='M32 26v24a18 18 0 0036 0V26' stroke='%23fff' stroke-width='9' fill='none' stroke-linecap='round'/><circle cx='70' cy='70' r='10' fill='none' stroke='%23fff' stroke-width='8'/></svg>">
<style>
:root{
  color-scheme:light;
  --bg:#f4f6fb;
  --card:#ffffff;
  --soft:#f6f8fd;
  --soft-2:#eef2fa;
  --ink:#151924;
  --ink-2:#596074;
  --ink-3:#98a0b5;
  --line:#e8ecf5;
  --line-2:#dae0ee;
  --brand:#2f51b5;
  --brand-2:#4a6ede;
  --brand-soft:#e9eefc;
  --red:#cf3c2c;
  --red-soft:#fdeae7;
  --amber:#b4740a;
  --amber-soft:#fdf3e0;
  --green:#1d7a5b;
  --green-soft:#e6f5ef;
  --s1:0 1px 2px rgba(20,32,70,.06);
  --s2:0 6px 16px -8px rgba(20,32,70,.22);
  --s3:0 26px 60px -24px rgba(20,32,70,.5);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:'Onest','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior-y:none;
  padding-top:env(safe-area-inset-top,0px);
}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.025em}
p{margin:0}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.only-desk{display:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid var(--bg)}

/* ======= каркас ======= */
.shell{display:block;min-height:100dvh}
.rail{display:none}

/* верхняя панель (мобайл) */
.appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:10px}
.appbar .sq{width:34px;height:34px;border-radius:11px;background:var(--brand);display:grid;place-items:center;flex:none}
.appbar h1{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icb{width:38px;height:38px;border-radius:12px;background:var(--soft);border:1px solid var(--line);
  display:grid;place-items:center;flex:none;cursor:pointer;color:var(--ink-2)}
.icb:active{background:var(--soft-2)}
.searchwrap{display:none;flex:1}
body.searching .searchwrap{display:block}
body.searching .appbar h1,body.searching .appbar .sq,body.searching .icb.hide-s{display:none}
.searchwrap input{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
.searchwrap input:focus{outline:none;border-color:var(--brand-2);background:#fff}

.view{padding:14px 14px 104px;max-width:1180px;margin:0 auto}

/* ======= заголовок экрана ======= */
.vh{margin-bottom:14px}
.vh h2{font-size:26px;font-weight:800;letter-spacing:-.035em;display:none}
.vh p{font-size:13.5px;color:var(--ink-3);margin-top:4px;max-width:62ch}
.vh .tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ======= герой ======= */
.hero{background:linear-gradient(140deg,#2f51b5 0%,#4a6ede 55%,#5b7ce8 100%);color:#fff;border-radius:22px;
  padding:18px 18px 16px;box-shadow:0 18px 34px -20px rgba(47,81,181,.9);margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.09)}
.hero .day{font-size:12.5px;opacity:.85}
.hero h2{font-size:23px;margin-top:3px;letter-spacing:-.03em}
.hero .who{font-size:13px;opacity:.85;margin-top:4px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px;position:relative}
.hs{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:15px;padding:11px 12px;
  text-align:left;color:#fff;cursor:pointer}
.hs:active{background:rgba(255,255,255,.26)}
.hs .n{font-size:23px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hs .l{font-size:11px;opacity:.9;margin-top:5px;line-height:1.25}

/* мини-плитки */
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mtile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;
  cursor:pointer;box-shadow:var(--s1);display:flex;gap:11px;align-items:center}
.mtile .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--green-soft);color:var(--green)}
.mtile.b .ico{background:var(--brand-soft);color:var(--brand)}
.mtile .n{font-size:19px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mtile .l{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.2}

/* ======= карточка-секция ======= */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--s1);
  overflow:hidden;margin-bottom:14px}
.ch{padding:15px 16px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ch h3{font-size:16.5px}
.ch p{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.ch+.rows,.ch+.gh,.ch+.tw,.ch+.plist{border-top:1px solid var(--line)}
.lnk{background:none;border:0;color:var(--brand);font-size:13.5px;font-weight:600;cursor:pointer;padding:6px 8px;
  border-radius:10px;flex:none}
.lnk:active{background:var(--brand-soft)}

/* ======= строки дел ======= */
.gh{padding:11px 16px 8px;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;
  text-transform:uppercase;display:flex;justify-content:space-between;background:var(--soft)}
.gh.hot{color:var(--red);background:var(--red-soft)}
.row{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line);
  position:relative;cursor:pointer}
.rows>.row:first-child,.gh+.row{border-top:0}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:transparent}
.row.urg::before{background:var(--red)}
.row.ovr::before{background:var(--amber)}
.row.done{opacity:.45}
.row.done .ttl{text-decoration:line-through}
.row:active{background:var(--soft)}
.cbx{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--brand);cursor:pointer}
.bd{flex:1;min-width:0}
.ttl{font-size:15.5px;font-weight:600;line-height:1.35;word-break:break-word}
.ttl .who{color:var(--brand)}
.meta{margin-top:6px;font-size:12.5px;color:var(--ink-3);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tag{background:var(--soft-2);border-radius:8px;padding:3px 9px;font-size:11.5px;color:var(--ink-2);font-weight:500}
.when.o{color:var(--red);font-weight:600}
.when.s{color:var(--amber);font-weight:600}
.fl{background:var(--red);color:#fff;border-radius:8px;padding:3px 9px;font-size:11px;font-weight:700}
.acts{display:none;gap:4px;flex:none}
.empty{padding:30px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.empty b{display:block;font-size:15.5px;color:var(--ink-2);margin-bottom:5px;font-weight:600}
.empty .ring{width:46px;height:46px;border-radius:16px;background:var(--soft-2);display:grid;place-items:center;
  margin:0 auto 12px;color:var(--brand)}

/* ======= карточки наблюдения (мобайл) ======= */
.tw{display:none}
.plist{display:grid;gap:0}
.pcard{padding:15px 16px;border-top:1px solid var(--line);cursor:pointer}
.plist>.pcard:first-child{border-top:0}
.pcard:active{background:var(--soft)}
.pc-h{display:flex;gap:9px;align-items:center;justify-content:space-between}
.pc-h b{font-size:15.5px;font-weight:600}
.mkbv{background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:3px 9px;font-weight:700;
  font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.pc-dx{font-size:13.5px;color:var(--ink-2);margin-top:5px}
.pc-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.pc-g{margin-top:11px;display:grid;gap:7px}
.pc-r{display:flex;gap:10px;font-size:13px}
.pc-r i{font-style:normal;color:var(--ink-3);min-width:104px;flex:none;font-size:12.5px}
.pc-r span{color:var(--ink-2)}
.due.bad{color:var(--red);font-weight:600}
.due.soon{color:var(--amber);font-weight:600}

/* ======= главное меню ======= */
.mgrp{margin-bottom:16px}
.mgrp h4{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;
  margin:0 0 8px;padding:0 4px}
.mrow{display:flex;gap:12px;align-items:center;width:100%;padding:14px 16px;border-top:1px solid var(--line);
  background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;text-align:left}
.card>.mrow:first-child{border-top:0}
.mrow:active{background:var(--soft)}
.mrow .ic{width:40px;height:40px;border-radius:13px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;flex:none}
.mrow.red .ic{background:var(--red-soft);color:var(--red)}
.mrow.green .ic{background:var(--green-soft);color:var(--green)}
.mrow.gray .ic{background:var(--soft-2);color:var(--ink-2)}
.mrow b{flex:1;font-size:15.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .ct{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;background:var(--soft-2);
  border-radius:999px;padding:3px 10px;font-weight:600}
.mrow .ct.hot{background:var(--red);color:#fff}
.mrow .chev{color:var(--line-2);flex:none}

/* ======= отметка «выполнено» ======= */
.dbtn{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2);background:#fff;display:grid;
  place-items:center;flex:none;cursor:pointer;color:transparent;margin-top:1px}
.dbtn:active{transform:scale(.93)}
.row.done .dbtn{background:var(--green);border-color:var(--green);color:#fff}
.row:not(.done) .dbtn:hover{border-color:var(--green);color:#bcd8cd}

/* ======= сортировка ======= */
.sortbar{display:flex;gap:7px;padding:11px 14px;align-items:center;flex-wrap:wrap;background:var(--soft);
  border-top:1px solid var(--line)}
.sortbar span{font-size:12px;color:var(--ink-3);margin-right:2px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;
  color:var(--ink-2);cursor:pointer;font-weight:500}
.sc.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

/* ======= неделя ======= */
.wkbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.wkbar .tt{font-size:14.5px;font-weight:600;flex:1;min-width:120px}
.wkbar input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;
  font-size:14px;max-width:170px}
.wk{display:grid;gap:12px}
.wday{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--s1)}
.wday.tdy{border-color:var(--brand)}
.wdh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--soft)}
.wday.tdy .wdh{background:var(--brand-soft)}
.wdh b{font-size:15px;text-transform:capitalize}
.wday.tdy .wdh b{color:var(--brand)}
.wdh .dt{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wdh .cnt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.wdh .add{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;color:var(--brand);font-size:21px;line-height:1;cursor:pointer;flex:none}
.wempty{padding:13px 14px;font-size:13px;color:var(--ink-3)}

/* ======= календарь ======= */
.cal{padding:14px 14px 18px}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.calbar h3{font-size:16.5px;text-transform:capitalize}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dw{font-size:10.5px;color:var(--ink-3);text-align:center;text-transform:uppercase;letter-spacing:.04em;padding-bottom:3px}
.cd{background:var(--soft);border:1.5px solid transparent;border-radius:13px;aspect-ratio:1/1;padding:5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cd .d{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.cd .b{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.cd .b.r{background:var(--red)}
.cd.out{opacity:.28}
.cd.tdy{background:var(--brand-soft)}
.cd.tdy .d{color:var(--brand);font-weight:800}
.cd.sel{border-color:var(--brand);background:#fff}

/* ======= нижнее меню ======= */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:3px 2px;
  color:var(--ink-3);font-size:10.5px;font-weight:500;cursor:pointer;position:relative}
.tab[aria-current="true"]{color:var(--brand);font-weight:700}
.tab .bd2{position:absolute;top:-2px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;
  border-radius:999px;padding:0 5px;font-weight:700;min-width:16px;line-height:16px}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);z-index:45;width:58px;height:58px;
  border-radius:20px;background:var(--brand);color:#fff;border:0;display:grid;place-items:center;
  box-shadow:0 16px 30px -10px rgba(47,81,181,.9);cursor:pointer}
.fab:active{transform:scale(.96)}

/* шторка «Ещё» */
.sheet{position:fixed;inset:0;z-index:70;display:none}
.sheet.on{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(15,22,45,.45)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;
  padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:84dvh;overflow-y:auto;box-shadow:var(--s3)}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line-2);margin:4px auto 10px}
.grp{margin-bottom:14px}
.grp h4{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;
  margin:0 0 6px;padding:0 10px}
.nav{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:14px;
  padding:12px 10px;cursor:pointer;color:var(--ink);font-size:15px;text-align:left}
.nav svg{flex:none;color:var(--ink-3)}
.nav em{font-style:normal;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ct{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;background:var(--soft-2);
  border-radius:999px;padding:2px 9px;min-width:24px;text-align:center}
.nav:active{background:var(--soft)}
.nav[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav[aria-current="true"] svg{color:var(--brand)}
.nav .ct.hot{background:var(--red);color:#fff}

/* ======= кнопки ======= */
.btn{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 15px;font-size:14.5px;
  font-weight:600;cursor:pointer;box-shadow:var(--s1);white-space:nowrap}
.btn:active{background:var(--soft)}
.btn-p{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 10px 20px -10px rgba(47,81,181,.9)}
.btn-p:active{background:var(--brand-2)}
.btn-s{padding:8px 12px;font-size:13px;border-radius:11px}

/* ======= формы ======= */
form.qa{display:none}
dialog{border:0;border-radius:24px;background:var(--card);color:var(--ink);padding:0;width:min(640px,100%);
  max-width:100%;max-height:92dvh;box-shadow:var(--s3)}
dialog::backdrop{background:rgba(15,22,45,.5);backdrop-filter:blur(3px)}
@media (max-width:640px){
  dialog{width:100%;margin:auto auto 0;border-radius:24px 24px 0 0;max-height:94dvh}
}
.dh{padding:18px 20px 5px;font-size:20px;font-weight:800;letter-spacing:-.03em}
.dsub{padding:0 20px 14px;font-size:12.5px;color:var(--ink-3);border-bottom:1px solid var(--line)}
.db{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:auto;max-height:62dvh}
.db label{font-size:12px;color:var(--ink-3);display:block}
.db label span{display:block;margin-bottom:5px;font-weight:600}
.db input,.db select,.db textarea{width:100%;background:var(--soft);border:1px solid var(--line);
  border-radius:13px;padding:12px 13px}
.db input:focus,.db select:focus,.db textarea:focus{outline:none;border-color:var(--brand-2);background:#fff;
  box-shadow:0 0 0 3px var(--brand-soft)}
.w2{grid-column:span 2}
@media (max-width:620px){.db{grid-template-columns:1fr}.w2{grid-column:span 1}}
.df{padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:9px}
.df .btn{flex:1;text-align:center}

.toast{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
  background:#1a2133;color:#fff;border-radius:16px;padding:13px 16px;display:flex;gap:14px;align-items:center;
  justify-content:space-between;font-size:14px;z-index:90;box-shadow:var(--s3)}
.toast button{background:none;border:0;color:#9ab6ff;font-weight:700;cursor:pointer;flex:none}
.kbd{font-size:12px;color:var(--ink-2);background:var(--soft-2);border-radius:7px;padding:2px 8px}
.info{padding:16px;display:grid;gap:10px;font-size:13.5px;color:var(--ink-2)}
.dataline{padding:14px 16px;display:grid;gap:9px}
.dataline .btn{width:100%}

/* ================= ДЕСКТОП ================= */
@media (min-width:900px){
  body{font-size:15px}
  .only-desk{display:initial}
  .shell{display:grid;grid-template-columns:270px minmax(0,1fr)}
  .tabs,.fab,.appbar{display:none}
  .rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100dvh;overflow-y:auto;
    background:var(--card);border-right:1px solid var(--line);padding:22px 14px 18px}
  .logo{display:flex;gap:11px;align-items:center;padding:0 8px 4px}
  .logo .sq{width:40px;height:40px;border-radius:13px;background:var(--brand);display:grid;place-items:center;flex:none;
    box-shadow:0 10px 18px -10px rgba(47,81,181,.9)}
  .logo b{display:block;font-size:14.5px}
  .logo i{display:block;font-style:normal;font-size:12px;color:var(--ink-3)}
  .railfoot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
  .nav{font-size:14px;padding:9px 10px;border-radius:11px;color:var(--ink-2)}

    background:rgba(244,246,251,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}

  .row{cursor:default}
  .row:hover{background:var(--soft)}
  .plist{display:none}
  .tw{display:block;overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:900px}
  th,td{text-align:left;padding:13px 16px;border-top:1px solid var(--line);vertical-align:top}
  th{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;
    background:var(--soft);white-space:nowrap;border-top:0}

  .mini{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px}
  form.qa{display:grid;grid-template-columns:repeat(12,1fr);gap:9px;padding:14px 16px;background:var(--soft);
    border-top:1px solid var(--line)}
  form.qa input,form.qa select{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
  form.qa input:focus,form.qa select:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
  .c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer}

}
@media (max-width:899px){.chips,.chk{display:none}}

@media print{

    <button class="btn btn-p" value="save" type="submit">Сохранить</button>

</form></dialog>

<script>
(function(){
"use strict";
/* ---- блокировка зума ---- */
["gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
let lastTap=0;
document.addEventListener("touchend",e=>{
  const n=Date.now();
  if(n-lastTap<400&&!e.target.closest("input,textarea,select"))e.preventDefault();
  lastTap=n;},{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault());

const LS="pediatr-planner-v3";
const CATS=[["tmk","ТМК и госпитализации"],["sankur","Санаторно-курортное лечение"],["f079","Справка 079/у"],
["f086","Справка 086/у"],["drugs","Выписка лекарств"],["lab","Лабораторная диагностика"],
["instr","Инструментальная диагностика"],["other","Прочее"]];
const CN=Object.fromEntries(CATS);
const TPL={tmk:["ТМК с областью","Направление на госпитализацию","Согласовать плановую госпитализацию","Запросить выписной эпикриз"],
 sankur:["Справка 070/у","Собрать анализы на сан-кур","Оформить путёвку","Уточнить профиль санатория"],
 f079:["Справка 079/у в лагерь","Сверить прививки для 079/у"],
 f086:["Справка 086/у для поступления","Осмотры специалистов для 086/у"],
 drugs:["Выписать льготный рецепт","Продлить рецепт","Заявка на лекарство"],
 lab:["ОАК + ОАМ","Биохимия крови","Кал на я/г","Мазок / посев"],
 instr:["УЗИ брюшной полости","ЭКГ","ЭхоКГ","Рентген","ФГДС"],
 other:["Позвонить родителям","Патронаж на дому","Оформить документы"]};
const REGN={disp:"Диспансерное наблюдение",inv:"Дети-инвалиды"};
const DOW=["пн","вт","ср","чт","пт","сб","вс"];
const MON=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONR=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const I={dash:'<path d="M4 13h7V4H4zM13 20h7v-9h-7zM13 8h7V4h-7zM4 20h7v-4H4z"/>',
 urgent:'<path d="M12 3s5 4.5 5 9a5 5 0 0 1-10 0c0-1.7.8-3.2 1.7-4.4C9.8 9 12 8 12 3z"/>',
 plan:'<path d="M4 6h16M4 12h16M4 18h10"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 users:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6S14 16 14.5 19"/><path d="M16 11.2a3 3 0 0 0 0-5.6M18.5 19c-.2-1.6-.7-2.9-1.6-3.8"/>',
 heart:'<path d="M12 20s-7-4.4-7-9.3A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.7C19 15.6 12 20 12 20z"/>',
 done:'<path d="M20 6 9 17l-5-5"/>',
 set:'<circle cx="12" cy="12" r="3.2"/><path d="M4.6 12c0-.4 0-.8.1-1.2l-2-1.5 2-3.4 2.3 1c.6-.5 1.3-.9 2-1.2L11.4 3h4l.4 2.7c.7.3 1.4.7 2 1.2l2.3-1 2 3.4-2 1.5c.1.8.1 1.6 0 2.4l2 1.5-2 3.4-2.3-1c-.6.5-1.3.9-2 1.2l-.4 2.7h-4l-.4-2.7c-.7-.3-1.4-.7-2-1.2l-2.3 1-2-3.4 2-1.5c-.1-.4-.1-.8-.1-1.2z"/>',
 home:'<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
 more:'<circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>'};
const ic=(k,s)=>'<svg width="'+(s||19)+'" height="'+(s||19)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+I[k]+'</svg>';

let D={meta:{doctor:"Алёшина Татьяна Алексеевна",short:"Алёшина Т. А.",uch:"6",
  clinic:"Губкинская городская больница",nurse:""},tasks:[],pats:[]};
let view="home",q="",calM=null,selDay="",editT=null,editP=null,wkDate=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY=()=>iso(new Date());
const shift=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d);};
const fmt=s=>s?s.split("-").reverse().join("."):"";
const hm=()=>pad(new Date().getHours())+":"+pad(new Date().getMinutes());
const over=t=>!t.done&&t.date&&(t.date<TODAY()||(t.date===TODAY()&&t.time&&t.time<hm()));
const isTd=t=>!t.done&&t.date===TODAY();
const dueCls=d=>!d?"":d<TODAY()?"due bad":d<=shift(7)?"due soon":"";
const niceDate=()=>{const d=new Date();return DOW[(d.getDay()+6)%7]+", "+d.getDate()+" "+MONR[d.getMonth()];};
const hello=()=>{const h=new Date().getHours();return h<5?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер";};

function load(){try{const r=localStorage.getItem(LS)||localStorage.getItem("pediatr-planner-v2");
  if(r){const o=JSON.parse(r);D.tasks=o.tasks||[];D.pats=o.pats||[];if(o.meta)D.meta=Object.assign(D.meta,o.meta);}}catch(e){}}
let sT=null;
function save(){clearTimeout(sT);sT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(D));}
  catch(e){toast("Не удалось сохранить — переполнено хранилище");}},120);}
function apply(){render();save();}
function toast(m,u){
  const o=$(".toast");if(o)o.remove();
  const el=document.createElement("div");el.className="toast";
  el.innerHTML="<span>"+esc(m)+"</span>"+(u?'<button type="button">Отменить</button>':"");
  document.body.appendChild(el);
  if(u)el.querySelector("button").onclick=()=>{u();el.remove();};
  setTimeout(()=>{if(el.parentNode)el.remove();},5500);
}

const NAVG=()=>[["Обзор",[["dash","Сводка дня","dash"],["urgent","Срочно","urgent"],["plan","План по датам","plan"],
  ["week","Неделя по дням","cal"],["cal","Календарь","cal"]]],
 ["Направления и документы",CATS.map(c=>[c[0],c[1],"folder"])],
 ["Участок №"+D.meta.uch,[["disp","Диспансерные","users"],["inv","Дети-инвалиды","heart"]]],
 ["Прочее",[["done","Выполнено","done"],["data","Данные и настройки","set"]]]];
const open_=()=>D.tasks.filter(t=>!t.done);
function counts(){
  const o=open_(),c={urgent:o.filter(t=>t.urgent).length,plan:o.length,done:D.tasks.length-o.length,
    disp:D.pats.filter(p=>p.group==="disp").length,inv:D.pats.filter(p=>p.group==="inv").length};
  CATS.forEach(x=>c[x[0]]=o.filter(t=>t.cat===x[0]).length);return c;
}
function navHTML(){
  const c=counts();
  return '<div class="grp"><button class="nav" data-go="home" aria-current="'+(view==="home")+'">'+ic("home")+
   '<em>Главная</em></button></div>'+
   NAVG().map(g=>'<div class="grp"><h4>'+g[0]+'</h4>'+g[1].map(it=>
   '<button class="nav" data-go="'+it[0]+'" aria-current="'+(view===it[0])+'">'+ic(it[2])+'<em>'+it[1]+'</em>'+
   (c[it[0]]?'<span class="ct'+(it[0]==="urgent"?" hot":"")+'">'+c[it[0]]+'</span>':"")+'</button>').join("")+'</div>').join("");
}
function tabsHTML(){
  const c=counts();
  const T=[["home","Главная","home",0],["dash","Сводка","dash",0],["plan","План","plan",c.urgent],
    ["week","Неделя","cal",0],["disp","Участок","users",0]];
  return T.map(t=>'<button class="tab" data-tab="'+t[0]+'" aria-current="'+(view===t[0])+'">'+ic(t[2],22)+
   '<span>'+t[1]+'</span>'+(t[3]?'<span class="bd2">'+t[3]+'</span>':"")+'</button>').join("");
}

/* ---- дела ---- */
function row(t){
  const ov=over(t),sn=!ov&&isTd(t);
  const when=t.date?fmt(t.date)+(t.time?", до "+t.time:""):"без срока";
  return '<div class="row'+(t.urgent&&!t.done?" urg":"")+(ov?" ovr":"")+(t.done?" done":"")+'" data-open="'+t.id+'">'+
  '<button class="dbtn" type="button" data-done="'+t.id+'" aria-pressed="'+(!!t.done)+'" title="Выполнено" aria-label="Отметить выполненным">'+
  '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>'+
  '<div class="bd"><p class="ttl"><span class="who">'+esc(t.fio)+'</span> — '+esc(t.text)+'</p>'+
  '<p class="meta"><span class="tag">'+esc(CN[t.cat]||"Прочее")+'</span>'+
  '<span class="when num'+(ov?" o":sn?" s":"")+'">'+when+(ov?" · просрочено":"")+'</span>'+
  (t.urgent&&!t.done?'<span class="fl">срочно</span>':"")+(t.note?"<span>"+esc(t.note)+"</span>":"")+'</p></div>'+
  '<div class="acts">'+(t.done?"":'<button class="btn btn-s" data-snz="'+t.id+'">+1 день</button>')+
  '<button class="btn btn-s" data-edit="'+t.id+'">Изменить</button></div></div>';
}
const sortT=(a,b)=>{
  if(!!a.urgent!==!!b.urgent)return a.urgent?-1:1;
  const ad=a.date||"9999",bd=b.date||"9999";
  if(ad!==bd)return ad<bd?-1:1;
  return (a.time||"99:99")<(b.time||"99:99")?-1:1;};
const emptyBox=(t,s)=>'<div class="empty"><div class="ring">'+ic("done",22)+'</div><b>'+t+'</b>'+s+'</div>';
const byAbc=(a,b)=>(a.fio||"").localeCompare(b.fio||"","ru");
function sortTasks(arr){
  const m=D.meta.sortT||"date";
  if(m==="abc")return arr.sort((a,b)=>byAbc(a,b)||sortT(a,b));
  if(m==="cat")return arr.sort((a,b)=>(CN[a.cat]||"").localeCompare(CN[b.cat]||"","ru")||sortT(a,b));
  return arr.sort(sortT);
}
function sortBarT(){
  const m=D.meta.sortT||"date";
  const b=(k,n)=>'<button class="sc'+(m===k?" on":"")+'" data-sort="'+k+'">'+n+'</button>';
  return '<div class="sortbar"><span>Сортировка:</span>'+b("date","По дате")+b("abc","По алфавиту")+b("cat","По разделам")+'</div>';
}
function sortPats(arr){
  const m=D.meta.sortP||"abc";
  if(m==="visit")return arr.sort((a,b)=>(a.nextVisit||"9999")<(b.nextVisit||"9999")?-1:1);

function list(arr,grouped){

  const g={over:[],today:[],tom:[],week:[],later:[],none:[]},t1=TODAY(),t2=shift(1),t7=shift(7);
  arr.forEach(t=>{if(!t.date)g.none.push(t);else if(over(t))g.over.push(t);else if(t.date===t1)g.today.push(t);
    else if(t.date===t2)g.tom.push(t);else if(t.date<=t7)g.week.push(t);else g.later.push(t);});
  const N={over:"Просрочено",today:"Сегодня",tom:"Завтра",week:"Ближайшая неделя",later:"Позже",none:"Без срока"};
  return Object.keys(g).filter(k=>g[k].length).map(k=>'<p class="gh'+(k==="over"?" hot":"")+'"><span>'+N[k]+
    '</span><span class="num">'+g[k].length+'</span></p>'+g[k].map(row).join("")).join("");
}

  $("#tabs").innerHTML=tabsHTML();
  $("#lgDoc").textContent=D.meta.short||D.meta.doctor;
  $("#lgSub").textContent="Участок №"+D.meta.uch;
  $("#rfoot").innerHTML=esc(D.meta.clinic)+(D.meta.nurse?"<br>м/с "+esc(D.meta.nurse):"");
  $("#dateLbl").textContent=niceDate();
  $("#fioList").innerHTML=Array.from(new Set(D.pats.map(p=>p.fio).concat(D.tasks.map(t=>t.fio))))
    .filter(Boolean).sort().map(f=>'<option value="'+esc(f)+'">').join("");
  const v=$("#view");
  if(q.trim())v.innerHTML=vSearch();
  else if(view==="home")v.innerHTML=vHome();
  else if(view==="dash")v.innerHTML=vDash();
  else if(view==="week")v.innerHTML=vWeek();
  else if(view==="cal")v.innerHTML=vCal();
  else if(view==="disp"||view==="inv")v.innerHTML=vReg();
  else if(view==="data")v.innerHTML=vData();
  else v.innerHTML=vTasks();
  const h2=$("#view h2");
  $("#mobTitle").textContent=h2?h2.textContent:"Планер";
  const inner=view!=="home"||!!q.trim();
  $("#mBack").hidden=!inner;
  $("#mLogo").style.display=inner?"none":"";
  document.title=(h2?h2.textContent:"Планер")+" — планер педиатра";
}
function go(v){view=v;if(v!=="cal")selDay="";closeSearch();$("#sheet").classList.remove("on");
  render();window.scrollTo(0,0);}
function closeSearch(){q="";$("#q").value="";$("#qd").value="";
  document.body.classList.remove("searching");$("#mClose").hidden=true;}
const addDay=s=>{const d=new Date(s);d.setDate(d.getDate()+1);return iso(d);};

document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");
  if(tb){const k=tb.dataset.tab;if(k==="more")$("#sheet").classList.add("on");else go(k);return;}
  if(e.target.closest("[data-close]")){$("#sheet").classList.remove("on");return;}
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return;}
  const d=e.target.closest("[data-done]");
  if(d){const t=D.tasks.find(x=>x.id===d.dataset.done);
    if(t){t.done=!t.done;t.doneAt=t.done?new Date().toISOString():"";apply();
      toast(t.done?"Выполнено: "+t.text:"Возвращено в работу",()=>{t.done=!t.done;apply();});}return;}
  const so=e.target.closest("[data-sort]");
  if(so){D.meta.sortT=so.dataset.sort;apply();return;}
  const sp2=e.target.closest("[data-sortp]");
  if(sp2){D.meta.sortP=sp2.dataset.sortp;apply();return;}
  const ad=e.target.closest("[data-add]");
  if(ad){selDay=ad.dataset.add;openTask(null);return;}
  const s=e.target.closest("[data-snz]");
  if(s){const t=D.tasks.find(x=>x.id===s.dataset.snz);
    if(t){t.date=t.date&&t.date>=TODAY()?addDay(t.date):shift(1);apply();toast("Перенесено на "+fmt(t.date));}return;}
  const ed=e.target.closest("[data-edit]");if(ed){openTask(ed.dataset.edit);return;}
  const np=e.target.closest("[data-newpat]");if(np){openPat(null,np.dataset.newpat);return;}
  const ep=e.target.closest("[data-editpat]");if(ep){openPat(ep.dataset.editpat);return;}
  const op=e.target.closest("[data-open]");if(op){openTask(op.dataset.open);return;}
  const wk=e.target.closest("[data-wk]");
  if(wk){const n=+wk.dataset.wk;
    if(!n)wkDate=null;else{const b=wkDate?new Date(wkDate):new Date();b.setDate(b.getDate()+n);wkDate=iso(b);}
    render();return;}
  const mo=e.target.closest("[data-mon]");
  if(mo){const b=new Date(calM+"-01");b.setMonth(b.getMonth()+ +mo.dataset.mon);
    calM=b.getFullYear()+"-"+pad(b.getMonth()+1);render();return;}
  const dy=e.target.closest("[data-day]");if(dy){selDay=selDay===dy.dataset.day?"":dy.dataset.day;render();return;}
  if(e.target.closest("[data-dayclr]")){selDay="";render();return;}
  const tp=e.target.closest("[data-tpl]");
  if(tp){const f=$("#qaForm");if(f){f.text.value=tp.dataset.tpl;f.fio.focus();}return;}
  const id=e.target.id;
  if(id==="mBack"||e.target.closest("#mBack")){if(q.trim()){closeSearch();render();}else go("home");return;}
  if(id==="printBtn"||id==="printBtn2"){window.print();return;}
  if(id==="mSearch"){document.body.classList.add("searching");$("#mClose").hidden=false;
    setTimeout(()=>$("#q").focus(),40);return;}
  if(id==="mClose"){closeSearch();render();return;}
  if(id==="saveMeta"){D.meta.doctor=$("#mDoc").value.trim();D.meta.short=$("#mShort").value.trim();
    D.meta.uch=$("#mUch").value.trim();D.meta.clinic=$("#mClin").value.trim();D.meta.nurse=$("#mNur").value.trim();
    apply();toast("Сохранено");return;}
  if(id==="expJson"){dl("planer-kopiya-"+TODAY()+".json",JSON.stringify(D,null,2),"application/json");return;}
  if(id==="expT"){dl("dela-"+TODAY()+".csv",csv([["ФИО","Дело","Раздел","Дата","Время","Срочно","Статус","Примечание"]]
    .concat(D.tasks.slice().sort(sortT).map(t=>[t.fio,t.text,CN[t.cat]||"",fmt(t.date),t.time||"",t.urgent?"да":"",
    t.done?"выполнено":"в работе",t.note||""]))),"text/csv");return;}
  if(id==="expP"){dl("nablyudenie-"+TODAY()+".csv",csv([["Раздел","ФИО","Дата рождения","Группа здоровья","МКБ-10",
    "Расшифровка диагноза","Кратность","Приём был","Следующий приём","Реабилитация","Госпитализация",
    "Реабилитация после","Инвалидность до","ИПРА","Примечание"]].concat(D.pats.map(p=>[REGN[p.group],p.fio,p.dob,
    p.health,p.mkb,p.dx,p.freq,fmt(p.lastVisit),fmt(p.nextVisit),p.rehab,p.hosp,p.hrehab,fmt(p.disTo),p.ipra,p.note]))),"text/csv");return;}
  if(id==="impBtn"){$("#impFile").click();return;}
  if(id==="wipe"){if(confirm("Удалить все дела и карточки? Сначала скачайте копию."))
    {D.tasks=[];D.pats=[];apply();toast("Данные очищены");}return;}
});

document.addEventListener("submit",e=>{
  if(e.target.id!=="qaForm")return;
  e.preventDefault();const f=e.target;
  D.tasks.push({id:uid("t"),fio:f.fio.value.trim(),text:f.text.value.trim(),cat:f.cat.value,date:f.date.value||"",
    time:f.time.value||"",urgent:f.urgent.checked,note:"",done:false,created:new Date().toISOString()});
  apply();toast("Дело добавлено");
});
function onSearch(e){q=e.target.value;const other=e.target.id==="q"?"#qd":"#q";$(other).value=q;render();}
$("#q").addEventListener("input",onSearch);
$("#qd").addEventListener("input",onSearch);
$("#btnNew").onclick=()=>openTask(null);
$("#fab").onclick=()=>openTask(null);

const dT=$("#dlgTask"),fT=$("#fTask");
fT.cat.innerHTML=CATS.map(c=>'<option value="'+c[0]+'">'+c[1]+'</option>').join("");
function openTask(id){
  editT=id;fT.reset();
  const t=id?D.tasks.find(x=>x.id===id):null;
  $("#dhTask").textContent=t?"Изменить дело":"Новое дело";
  $("#tDel").hidden=!t;
  if(t){fT.fio.value=t.fio;fT.text.value=t.text;fT.cat.value=t.cat;fT.urgent.value=t.urgent?"1":"";
    fT.date.value=t.date||"";fT.time.value=t.time||"";fT.note.value=t.note||"";}
  else{if(CN[view])fT.cat.value=view;fT.date.value=selDay||TODAY();}
  dT.showModal();setTimeout(()=>fT.fio.focus(),50);
}
fT.addEventListener("submit",e=>{
  const v=e.submitter?e.submitter.value:"save";
  if(v==="cancel")return;
  if(v==="delete"){
    if(confirm("Удалить дело?")){const i=D.tasks.findIndex(x=>x.id===editT);
      if(i>=0){const t=D.tasks[i];D.tasks.splice(i,1);apply();toast("Дело удалено",()=>{D.tasks.splice(i,0,t);apply();});}}
    return;}
  if(!fT.fio.value.trim()||!fT.text.value.trim()){e.preventDefault();return;}
  const o={fio:fT.fio.value.trim(),text:fT.text.value.trim(),cat:fT.cat.value,urgent:!!fT.urgent.value,
    date:fT.date.value||"",time:fT.time.value||"",note:fT.note.value.trim()};
  const t=editT?D.tasks.find(x=>x.id===editT):null;
  if(t)Object.assign(t,o);else D.tasks.push(Object.assign({id:uid("t"),done:false,created:new Date().toISOString()},o));
  editT=null;apply();
});

const dP=$("#dlgPat"),fP=$("#fPat");
const PF=["fio","dob","health","mkb","freq","dx","lastVisit","nextVisit","rehab","hosp","hrehab","disTo","ipra","note"];
function openPat(id,group){
  editP=id;fP.reset();
  const p=id?D.pats.find(x=>x.id===id):null;
  const g=p?p.group:(group||(view==="inv"?"inv":"disp"));
  fP.dataset.group=g;
  $("#dhPat").textContent=p?"Карточка ребёнка":"Новая карточка";
  $("#dsPat").textContent=REGN[g];
  $("#pDel").hidden=!p;
  document.querySelectorAll("#fPat .inv").forEach(el=>el.style.display=g==="inv"?"":"none");
  if(p)PF.forEach(k=>{if(fP[k])fP[k].value=p[k]||"";});
  dP.showModal();setTimeout(()=>fP.fio.focus(),50);
}
fP.addEventListener("submit",e=>{
  const v=e.submitter?e.submitter.value:"save";
  if(v==="cancel")return;
  if(v==="delete"){
    if(confirm("Удалить карточку наблюдения?")){const i=D.pats.findIndex(x=>x.id===editP);
      if(i>=0){const p=D.pats[i];D.pats.splice(i,1);apply();toast("Карточка удалена",()=>{D.pats.splice(i,0,p);apply();});}}
    return;}
  if(!fP.fio.value.trim()){e.preventDefault();return;}
  const o={group:fP.dataset.group,updated:new Date().toISOString()};
  PF.forEach(k=>{if(fP[k])o[k]=fP[k].value.trim();});
  const p=editP?D.pats.find(x=>x.id===editP):null;
  if(p)Object.assign(p,o);else D.pats.push(Object.assign({id:uid("p")},o));
  editP=null;apply();
});

document.addEventListener("change",e=>{
  if(e.target.id==="wkPick"){if(e.target.value){wkDate=e.target.value;render();}return;}
  if(e.target.id!=="impFile")return;
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.tasks))throw 0;
    if(confirm("Заменить текущие записи данными из файла?\nОК — заменить, Отмена — добавить к текущим.")){
      D.tasks=o.tasks;D.pats=o.pats||[];if(o.meta)D.meta=Object.assign(D.meta,o.meta);
    }else{const a=new Set(D.tasks.map(t=>t.id));o.tasks.forEach(t=>{if(!a.has(t.id))D.tasks.push(t);});
      const b=new Set(D.pats.map(p=>p.id));(o.pats||[]).forEach(p=>{if(!b.has(p.id))D.pats.push(p);});}
    apply();toast("Копия загружена");}catch(err){toast("Файл не распознан");}};
  r.readAsText(f);e.target.value="";
});
function csv(rows){return "\uFEFF"+rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(";")).join("\r\n");}
function dl(n,t,ty){const b=new Blob([t],{type:ty+";charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select"))return;
  if(e.key==="n"||e.key==="N"||e.key==="т"||e.key==="Т"){e.preventDefault();openTask(null);}
  if(e.key==="/"){e.preventDefault();$("#qd").focus();}
});

load();render();
setInterval(()=>{const a=document.activeElement;
  if(document.querySelector("dialog[open]"))return;
  if(a&&a.matches&&a.matches("input,textarea,select"))return;
  render();},60000);
window.addEventListener("beforeunload",()=>{clearTimeout(sT);try{localStorage.setItem(LS,JSON.stringify(D));}catch(e){}});
})();
</script>
</body>
</html>
